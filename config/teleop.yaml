# Spacemouse teleoperation tuning shared by deploy, recording, and panel takeover.
# `brake` controls release behavior; `cartesian` and `joint` select per-space
# gains and target-lead caps; `takeover` controls the panel gain multiplier.
# `null` means derive or inherit as noted.
#
# The panel takeover previously had its own hardcoded gain of 0.003,
# independent of the deploy script. It now multiplies the control space's
# action_size, so at speed 1.0 in joint space it jogs at 0.008 — about 2.7x
# faster than before. Set speed to 0.375 to restore the old feel.
deadzone: 0.1
brake:
  on_release: true
  release_ticks: 1

cartesian:
  action_size: 0.015
  rotation_size: null      # null = follow action_size
  max_lead_m: 0.10
  max_lead_rad: 0.50

joint:
  action_size: 0.008
  rotation_size: null
  max_lead_m: null         # null = derive 0.9 * min(MAX_LEAD_M, ik.max_lead_m)
  max_lead_rad: null       # null = derive 0.9 * min(MAX_LEAD_RAD, ik.max_lead_rad)

takeover:
  speed: 1.0               # multiplies the control space's action_size
