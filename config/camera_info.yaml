# cam4 -- the in-hand D405. NOT YET CALIBRATED: filling this in turns on the
# predicted-trajectory overlay for the wrist view, and nothing else changes.
#
# Unlike the entries above, a camera on the gripper has no fixed pose in the
# robot base frame, so `t`/`q` here are relative to the link it is bolted to
# and `frame:` names that link. deploy/pi05/overlay.py composes them with
# forward kinematics every frame:
#
#     T_base_cam(q) = FK(q, frame) @ (q_xyzw, t)
#
# k/d are the device's own intrinsics for the streaming profile -- factory
# values, nothing to measure: read them from the SDK with the camera free, or
# from /cam4/color/camera_info under the ROS backend.
#
# t/q are the hand-eye transform and do have to be measured (a fiducial in
# view over several arm poses, cv2.calibrateHandEye), or taken off the mount
# drawing if it is trustworthy. A sanity check that needs no target: with a
# correct transform the gripper's own fingers sit still in the wrist image
# however the arm moves, and the drawn fingertip lands on them.
#
# cam4:
#   height: 270
#   width: 480
#   frame: fr3_hand_tcp          # the link the camera rides
#   distortion_model: plumb_bob
#   d: [...]
#   k: [...]
#   t: [...]                     # camera position in the `frame` above [m]
#   q: [...]                     # camera orientation in it, [x, y, z, w]

# inhand (218722271574) factory intrinsics at 480x270, model distortion.inverse_brown_conrady. Read off the device, not measured.
# Extrinsics (frame/t/q) come from scripts/calibrate_handeye.py; until they are here
# the panel will not draw a trajectory on this camera.
# Hand-eye calibration: 13 views, 0.22 px reprojection, target stationary to 12.8 mm / 2.72 deg.
# Hand-eye calibration: 12 views, 0.18 px reprojection, target stationary to 10.1 mm / 2.95 deg.
