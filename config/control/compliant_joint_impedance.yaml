# Compliant joint impedance: the joint-space counterpart, for pi0.5.
#
# Here all task-space gains are zero and tracking comes from the nullspace
# term, so the torque cap is the knob that matters:
#
#     nullspace.max_tau  -- the most the controller will ever apply, per joint
#
# The default profile caps at 5 N.m, which is already gentle; 3 N.m gives way
# sooner at the cost of slower tracking and more sag under load.

nullspace.damping: 0.4
nullspace.max_tau: 3.0        # was 5.0
nullspace.regularization: 1.0e-06
nullspace.stiffness: 2.0      # was 3.0

task.d_pos_x: -1.0
task.d_pos_y: -1.0
task.d_pos_z: -1.0
task.d_rot_x: -1.0
task.d_rot_y: -1.0
task.d_rot_z: -1.0
task.k_pos_x: 0.0
task.k_pos_y: 0.0
task.k_pos_z: 0.0
task.k_rot_x: 0.0
task.k_rot_y: 0.0
task.k_rot_z: 0.0

task.error_clip.x: 0.05
task.error_clip.y: 0.05
task.error_clip.z: 0.05
task.error_clip.rx: 0.25
task.error_clip.ry: 0.25
task.error_clip.rz: 0.25

use_coriolis_compensation: true
use_friction: true
use_gravity_compensation: false
use_local_jacobian: true
use_operational_space: false
use_sim_time: false
