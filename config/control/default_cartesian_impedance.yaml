limit_error: true
limit_torques: true

max_delta_tau: 0.5

nullspace.stiffness: 2.0   # softer nullspace so arm is more compliant in redundancy

stop_commands: false

# Lower Cartesian stiffness for a softer behavior (but still reasonably precise)
task.k_pos_x: 500.0
task.k_pos_y: 500.0
task.k_pos_z: 500.0
task.k_rot_x: 60.0
task.k_rot_y: 60.0
task.k_rot_z: 60.0

# Damping tuned near critical (approx. 2*sqrt(k) for unit inertia) to keep precision without oscillation
task.d_pos_x: 40.0
task.d_pos_y: 40.0
task.d_pos_z: 40.0
task.d_rot_x: 10.0
task.d_rot_y: 10.0
task.d_rot_z: 10.0

# Increased error clipping to allow larger position corrections (was 0.05 = 5cm)
task.error_clip.rx: 0.25
task.error_clip.ry: 0.25
task.error_clip.rz: 0.25
task.error_clip.x: 0.20
task.error_clip.y: 0.20
task.error_clip.z: 0.20

use_coriolis_compensation: true
use_friction: true
use_gravity_compensation: false
use_local_jacobian: true
use_operational_space: false
use_sim_time: false

