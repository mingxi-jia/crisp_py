# Cartesian impedance, k_pos = 1000 N/m with damping paired to it.
#
# Steady-state error under a constant disturbance is F/k, so stiffness is the
# direct lever on the residual this cell shows. Measured with
# deploy/deploy_spacemouse.py --test at k=500:
#
#     -5.7 mm one-directional bias   (~2.8 N)
#     +/-2.0 mm friction deadband    (~1.0 N breakaway)
#
# At k=1000 both should scale by 500/1000.
#
# d_pos is NOT left alone. zeta = d / (2*sqrt(k*m)) falls as k rises, so
# raising stiffness on its own converts a static error into overshoot and
# ringing -- the coast-after-release problem. d=110 targets zeta ~= 1.0 at an
# effective Cartesian inertia of 3 kg (it is configuration-dependent, roughly
# 2-5 kg, so expect zeta ~0.8-1.3 across the workspace).
#
# error_clip stays at 0.20 m, which means max force rises to k*clip =
# 1000 * 0.20 N. That is far above a Franka's collision reflex, so a
# collision will fault the arm rather than stopping it. Lower error_clip if
# you want the compliant profile's protection at this stiffness.
#
# LIVE STIFFNESS CHANGE. Bring it up with the e-stop in reach and back out if
# any axis buzzes or hunts -- high gains on a discrete-time controller can
# chatter near the control rate.

limit_error: true
limit_torques: true

max_delta_tau: 0.5

nullspace.stiffness: 5.0

stop_commands: false

task.k_pos_x: 1000.0
task.k_pos_y: 1000.0
task.k_pos_z: 1000.0
task.k_rot_x: 60.0
task.k_rot_y: 60.0
task.k_rot_z: 60.0

task.d_pos_x: 110.0
task.d_pos_y: 110.0
task.d_pos_z: 110.0
task.d_rot_x: 10.0
task.d_rot_y: 10.0
task.d_rot_z: 10.0

task.error_clip.rx: 0.25
task.error_clip.ry: 0.25
task.error_clip.rz: 0.25
task.error_clip.x: 0.20
task.error_clip.y: 0.20
task.error_clip.z: 0.20

use_coriolis_compensation: true
use_friction: true
use_gravity_compensation: false
use_local_jacobian: true
use_operational_space: false
use_sim_time: false
