[workspace]
preview = ["pixi-build"]
authors = ["Daniel San José Pro <42489409+danielsanjosepro@users.noreply.github.com>"]
channels = ["https://fast.prefix.dev/conda-forge", "pytorch3d"]
name = "crisp_py"
platforms = ["linux-64"]

[activation]
scripts = ["scripts/set_ros_env.sh"]

[system-requirements]
cuda = "12.1"

[dependencies]
python = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
open3d = ">=0.19.0,<0.20"
urchin = ">=0.0.29,<0.0.30"
#cuda = "==12.2"

[tasks]
test_raw = "pytest --cov=crisp_py --cov-report=html"
test = [{task="test_raw", environment="humble"}]
view_diagnostics = "python scripts/view_diagnostics.py"
view_diagnostics_humble = [{task="view_diagnostics", environment="humble"}]



[target.linux.dependencies]
libgl-devel = "*"

[environments]
humble = { features = ["humble", "crisp-py", "extra", "dev"] }
jazzy = { features = ["jazzy", "crisp-py", "extra", "dev"] }
humble-clean = { features = ["humble"] }

# humble
[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
colcon-common-extensions = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
ros-humble-rmw-zenoh-cpp = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
rosdep = "*"

# jazzy
[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
colcon-common-extensions = "*"
rosdep = "*"

[feature.dev.pypi-dependencies]
ruff= "*"
bumpver = "*"
build = "*"
twine = "*"
pre-commit = "*"
pytest = "*"  # for testing

[feature.crisp-py.pypi-dependencies]
crisp_python = { path = ".", editable = true }
# crisp_python = "1.0.x"  # if added from pypi


[feature.extra.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu121" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu121" }
# Core inference dependencies
hydra-core = "==1.3.2"
omegaconf = "*"
dill = "==0.3.8"
einops = "==0.8.1"
transformers = "*"
opencv-python = "*"
rich = "*"
matplotlib = "*"
tqdm = "*"
numcodecs = "==0.12.1"
zarr = "==2.16.1"
wandb = "==0.19.6"
diffusers = "==0.32.2"

#[pypi-dependencies]
#pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git" }

